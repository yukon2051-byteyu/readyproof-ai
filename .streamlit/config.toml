[theme]
base = "light"
primaryColor = "#1F4E8C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#1A2433"

[server]
# 公開環境では処理能力が小さいため、プログラム変更の監視（自動再読込）を止める
fileWatcherType = "none"
runOnSave = false
# 資料・録画のアップロード上限（MB）。アプリ側の上限（readyproof/config.py）も別にかかる
maxUploadSize = 200

[browser]
gatherUsageStats = false
